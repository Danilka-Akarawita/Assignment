name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    outputs:
      version: ${{ steps.resolve-version.outputs.version }}
      released: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          branch: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}

      - name: Resolve image version
        id: resolve-version
        run: |
          if [ "${{ steps.semrel.outputs.new_release_published }}" = "true" ] && [ -n "${{ steps.semrel.outputs.new_release_version }}" ]; then
            VERSION="${{ steps.semrel.outputs.new_release_version }}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Image version tag: ${VERSION}"

  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [test, release]
    if: always() && needs.test.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - service: knowledge-service
            context: .
            dockerfile: services/knowledge-service/Dockerfile
          - service: tool-execution-service
            context: .
            dockerfile: services/tool-execution-service/Dockerfile
          - service: ai-gateway-service
            context: .
            dockerfile: services/ai-gateway-service/Dockerfile
          - service: frontend
            context: services/frontend
            dockerfile: services/frontend/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image version tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            VERSION="0.0.0-pr.${{ github.event.pull_request.number }}"
          elif [ "${{ needs.release.outputs.released }}" = "true" ] && [ -n "${{ needs.release.outputs.version }}" ]; then
            VERSION="${{ needs.release.outputs.version }}"
          else
            VERSION="${{ needs.release.outputs.version }}"
          fi
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building ${{ matrix.service }}:${VERSION}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && needs.release.outputs.released == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && needs.release.outputs.released == 'true' }}
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}:${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
