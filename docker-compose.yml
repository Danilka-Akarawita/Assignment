version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg15
    container_name: postgres_db
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  auth-service:
    build: ./services/auth-service
    container_name: auth_service
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:app_pass@db:5432/app_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    env_file:
      - ./services/auth-service/.env
    networks:
      - app-network
    restart: unless-stopped

  knowledge-service:
    build: ./services/knowledge-service
    container_name: knowledge_service
    ports:
      - "3002:3002"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app_user:app_pass@db:5432/app_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      EMBEDDING_CACHE_ENABLED: "true"
      METADATA_QUERY_EXTRACTION_ENABLED: "true"
    env_file:
      - ./services/knowledge-service/.env
    networks:
      - app-network
    restart: unless-stopped

  tool-execution-service:
    build: ./services/tool-execution-service
    container_name: tool_execution_service
    ports:
      - "3003:3003"
    depends_on:
      db:
        condition: service_healthy
      knowledge-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://app_user:app_pass@db:5432/app_db
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:3002
    env_file:
      - ./services/tool-execution-service/.env
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - ai-gateway-service
      - knowledge-service
    environment:
      NEXT_PUBLIC_AUTH_API_URL: http://localhost:3001
      NEXT_PUBLIC_GATEWAY_API_URL: http://localhost:3004
      NEXT_PUBLIC_KNOWLEDGE_API_URL: http://localhost:3002
    networks:
      - app-network
    restart: unless-stopped

  ai-gateway-service:
    build: ./services/ai-gateway-service
    container_name: ai_gateway_service
    ports:
      - "3004:3004"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tool-execution-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://app_user:app_pass@db:5432/app_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      TOOL_EXECUTION_SERVICE_URL: http://tool-execution-service:3003
      KNOWLEDGE_SERVICE_URL: http://knowledge-service:3002
    env_file:
      - ./services/ai-gateway-service/.env
    networks:
      - app-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge